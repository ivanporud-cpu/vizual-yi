name: Build Yilmaz Visualizer APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Yilmaz-Visualizer.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yilmaz-Visualizer-APK
          path: Yilmaz-Visualizer.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v1.${{ github.run_number }}" Yilmaz-Visualizer.apk \
            --title "v1.${{ github.run_number }}" \
            --notes "Автоматическая сборка #${{ github.run_number }}" \
            --latest
