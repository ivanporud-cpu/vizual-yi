plugins {
    id 'com.android.application'
}

def buildNum = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()

android {
    namespace 'com.yilmaz.visualizer'
    compileSdk 34

    defaultConfig {
        applicationId "com.yilmaz.visualizer.app"
        minSdk 24
        targetSdk 34
        versionCode buildNum
        versionName "1.${buildNum}"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        debug {
            applicationIdSuffix ""
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
